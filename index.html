<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Puppy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 10%, rgba(255,255,255,0.96) 0 8%, rgba(255,255,255,0) 20%),
        linear-gradient(180deg, #8ed8ff 0%, #dff6ff 43%, #9de77b 78%, #33a52f 100%);
      cursor: none; user-select: none;
    }

    #scene-bg {
      position: fixed; inset: 0; overflow: hidden;
      pointer-events: none; z-index: 0;
      perspective: 900px;
    }
    #scene-bg::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 16%, rgba(255,255,255,0.88) 0 7%, rgba(255,255,255,0) 18%),
        radial-gradient(ellipse at 64% 20%, rgba(255,255,255,0.78) 0 9%, rgba(255,255,255,0) 22%),
        radial-gradient(ellipse at 84% 31%, rgba(255,255,255,0.72) 0 8%, rgba(255,255,255,0) 20%),
        linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0));
      filter: blur(1px);
    }
    .hill {
      position: absolute; bottom: 14vh;
      border-radius: 48% 52% 12% 10% / 70% 70% 16% 15%;
      transform: rotate(-7deg);
      box-shadow: inset -28px -24px 40px rgba(20,120,90,0.16), inset 24px 26px 38px rgba(255,255,255,0.25);
    }
    .hill.back {
      left: 36vw; width: 56vw; height: 34vh;
      background: linear-gradient(150deg, #86edf5 0%, #5acdd9 45%, #39a6bd 100%);
      opacity: 0.72; filter: blur(0.4px);
    }
    .hill.front {
      right: -8vw; bottom: 0; width: 45vw; height: 48vh;
      background: linear-gradient(145deg, #c3a485 0%, #80614d 54%, #3f3a3a 100%);
      border-radius: 70% 0 0 16% / 82% 0 0 18%;
      transform: rotate(-10deg) skewX(-8deg);
      box-shadow: inset -50px -26px 55px rgba(12,20,18,0.33), inset 25px 28px 35px rgba(255,255,255,0.22);
    }
    .grass {
      position: absolute; left: -4vw; right: -4vw; bottom: -9vh; height: 39vh;
      background:
        radial-gradient(ellipse at 30% 5%, rgba(255,255,255,0.46) 0 8%, rgba(255,255,255,0) 24%),
        repeating-linear-gradient(100deg, rgba(18,120,30,0.22) 0 2px, rgba(90,220,42,0) 2px 10px),
        linear-gradient(180deg, #88ef42 0%, #2fbd2a 34%, #0f6928 100%);
      clip-path: polygon(0 26%, 9% 21%, 20% 25%, 34% 15%, 48% 20%, 60% 10%, 76% 19%, 88% 11%, 100% 17%, 100% 100%, 0 100%);
      box-shadow: inset 0 24px 34px rgba(255,255,255,0.28), inset 0 -60px 85px rgba(0,35,20,0.42);
    }
    .grass::before {
      content: "";
      position: absolute; inset: -16px 0 0;
      background: repeating-linear-gradient(103deg, transparent 0 7px, rgba(245,255,210,0.55) 8px 10px, transparent 11px 17px);
      opacity: 0.65;
      transform: skewY(-3deg);
    }
    .stone {
      position: absolute; bottom: 18vh;
      background: linear-gradient(145deg, #cfb08c 0%, #8f765f 62%, #4b4039 100%);
      border-radius: 50% 50% 42% 38%;
      box-shadow: inset 18px 16px 24px rgba(255,255,255,0.22), inset -18px -24px 28px rgba(20,15,10,0.28);
    }
    .stone.one { left: 14vw; width: 11vw; height: 24vh; }
    .stone.two { left: 27vw; bottom: 16vh; width: 7vw; height: 17vh; }
    .stone.three { left: 8vw; bottom: 26vh; width: 5vw; height: 11vh; }
    .question-block {
      position: absolute;
      width: clamp(74px, 12vw, 160px); aspect-ratio: 1;
      display: grid; place-items: center;
      color: rgba(255,255,255,0.92);
      font: 900 clamp(46px, 8vw, 106px)/1 system-ui, sans-serif;
      text-shadow: 0 5px 0 rgba(160,120,0,0.35);
      background: linear-gradient(145deg, #fff245 0%, #ffe000 42%, #d9a800 100%);
      border-radius: 10px;
      box-shadow:
        inset 12px 14px 18px rgba(255,255,255,0.48),
        inset -14px -18px 20px rgba(145,95,0,0.28),
        0 18px 28px rgba(40,40,20,0.22);
      transform-style: preserve-3d;
    }
    .question-block::before,
    .question-block::after {
      content: ""; position: absolute; width: 10%; height: 10%;
      border-radius: 50%; background: rgba(180,140,0,0.36);
      box-shadow: calc(100% * 8.1) 0 rgba(180,140,0,0.36), 0 calc(100% * 8.1) rgba(180,140,0,0.36), calc(100% * 8.1) calc(100% * 8.1) rgba(180,140,0,0.36);
      left: 8%; top: 8%;
    }
    .question-block.big { left: -2vw; top: 23vh; transform: rotateY(-18deg) rotateZ(7deg); }
    .question-block.mid { right: 8vw; top: 42vh; transform: rotateZ(-13deg) rotateY(18deg); opacity: 0.8; }
    .question-block.ground { left: 19vw; bottom: 3vh; transform: rotateX(54deg) rotateZ(-8deg); }
    .brick-stack {
      position: absolute; left: 3vw; bottom: 13vh;
      width: 116px; height: 72px;
      background:
        linear-gradient(90deg, transparent 0 47%, rgba(0,0,0,0.22) 48% 52%, transparent 53%),
        repeating-linear-gradient(180deg, #7a442e 0 20px, #3a241f 20px 26px);
      box-shadow: inset 10px 8px 15px rgba(255,220,150,0.22), inset -10px -10px 16px rgba(0,0,0,0.34), 0 16px 22px rgba(0,0,0,0.2);
      transform: skewY(1deg);
    }
    .palm {
      position: absolute; bottom: 24vh; left: 6vw;
      width: 11px; height: 128px;
      background: linear-gradient(90deg, #4d2f25, #7a543d 45%, #2d201b);
      border-radius: 999px;
      transform: rotate(-8deg);
      box-shadow: inset -4px 0 4px rgba(0,0,0,0.24);
    }
    .palm::before {
      content: "";
      position: absolute; left: 50%; top: -18px;
      width: 110px; height: 70px;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0) 0 18%, #067d55 19% 34%, rgba(0,0,0,0) 35%),
        radial-gradient(ellipse at 20% 84%, rgba(0,0,0,0) 0 20%, #0aa760 21% 34%, rgba(0,0,0,0) 35%),
        radial-gradient(ellipse at 80% 84%, rgba(0,0,0,0) 0 20%, #076f54 21% 34%, rgba(0,0,0,0) 35%);
      transform: translateX(-50%) rotate(-10deg);
      filter: drop-shadow(0 5px 4px rgba(0,70,35,0.18));
    }

    #shield-bubble {
      position: fixed; pointer-events: none; z-index: 149;
      width: 140px; height: 90px; border-radius: 50%;
      border: 3px solid rgba(80,200,255,0.9);
      box-shadow: 0 0 22px 8px rgba(80,200,255,0.45), inset 0 0 20px rgba(80,200,255,0.18);
      transform: translate(-50%,-50%);
      animation: shieldPulse 0.7s ease-in-out infinite alternate;
    }
    @keyframes shieldPulse {
      from { box-shadow: 0 0 16px 5px rgba(80,200,255,0.3), inset 0 0 14px rgba(80,200,255,0.1); }
      to   { box-shadow: 0 0 32px 14px rgba(80,200,255,0.65), inset 0 0 28px rgba(80,200,255,0.28); }
    }
    #cursor-dot {
      position: fixed; width: 9px; height: 9px;
      background: rgba(180,110,40,0.45);
      border-radius: 50%; pointer-events: none;
      z-index: 9999; transform: translate(-50%,-50%);
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    #cursor-dot.hand-active {
      background: rgba(80, 200, 255, 0.85);
      box-shadow: 0 0 10px 4px rgba(80, 200, 255, 0.5);
      transform: translate(-50%, -50%) scale(1.4);
    }

    /* ── DOG ── */
    #dog-wrap {
      position: fixed; pointer-events: none; z-index: 100;
      transform: translate(-50%,-50%); will-change: left, top;
    }
    #dog-svg {
      width: 220px; height: 136px; display: block;
      filter: drop-shadow(0 8px 20px rgba(140,70,20,0.20));
      will-change: transform, filter;
      transform-origin: center center;
    }

    /* ── CANVAS ── */
    #particle-canvas {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 150;
    }

    /* ── CONDIMENT PANEL ── */
    #condiment-panel {
      position: fixed; right: 22px; top: 50%;
      transform: translateY(-50%);
      z-index: 250;
      display: none; flex-direction: column;
      gap: 10px; align-items: center;
      max-height: 96vh; overflow-y: auto;
      scrollbar-width: none; padding: 4px 0;
    }
    #condiment-panel::-webkit-scrollbar { display: none; }

    .bottle-wrap {
      cursor: grab; flex-shrink: 0;
      transform-origin: 50% 10%;
      transition: transform 0.28s cubic-bezier(.34,1.56,.64,1),
                  filter   0.20s ease;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.14));
      -webkit-user-drag: none;
    }
    .bottle-wrap:hover {
      transform: scale(1.13);
      filter: drop-shadow(0 5px 14px rgba(0,0,0,0.22));
    }
    .bottle-wrap.pouring {
      transform: rotate(138deg) scale(1.06); cursor: grabbing;
    }
    .bottle-label {
      margin-top: 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 5px; color: rgba(0,0,0,0.28);
      text-align: center; letter-spacing: 0.04em;
      pointer-events: none;
    }

    /* ── WEBCAM ── */
    #cam-wrap {
      position: fixed; bottom: 22px; right: 22px;
      z-index: 200; border-radius: 14px; overflow: hidden;
      box-shadow: 0 2px 20px rgba(0,0,0,0.09);
      background: #111; opacity: 0.72; transition: opacity 0.2s;
    }
    #cam-wrap:hover { opacity: 1; }
    #webcam { display: block; width: 144px; height: 108px; object-fit: cover; transform: scaleX(-1); }
    #emotion-tag {
      position: absolute; inset: auto 0 0;
      text-align: center; padding: 4px 0 5px;
      font: 10px/1 system-ui, sans-serif;
      color: rgba(255,255,255,0.82);
      background: rgba(0,0,0,0.28);
      letter-spacing: 0.07em; text-transform: uppercase;
    }
    #cam-toggle {
      position: fixed; bottom: 22px; right: 178px;
      z-index: 201; width: 28px; height: 28px;
      border-radius: 50%; border: none;
      background: rgba(160,90,30,0.12);
      color: rgba(120,70,20,0.55);
      font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    #cam-toggle:hover { background: rgba(160,90,30,0.22); }

    #cursor-dot2 {
      position: fixed; width: 9px; height: 9px;
      background: rgba(180,40,40,0.35);
      border-radius: 50%; pointer-events: none;
      z-index: 9999; transform: translate(-50%,-50%);
      transition: background 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    #cursor-dot2.hand2-active {
      background: rgba(255, 80, 80, 0.85);
      box-shadow: 0 0 10px 4px rgba(255, 80, 80, 0.5);
      transform: translate(-50%, -50%) scale(1.4);
    }

    #hold-hint {
      position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
      font-family: 'Press Start 2P', monospace; font-size: 6px;
      color: rgba(0,0,0,0.15); letter-spacing: 0.06em;
      pointer-events: none; white-space: nowrap;
    }

    #score-board {
      position: fixed; top: 14px; left: 50%;
      transform: translateX(-50%);
      z-index: 320;
      display: grid;
      grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr);
      align-items: center; gap: 10px;
      min-width: min(520px, calc(100vw - 28px));
      padding: 9px 12px;
      border: 3px solid rgba(80,120,210,0.74);
      border-radius: 10px;
      background: rgba(255,255,255,0.78);
      box-shadow: 0 9px 0 rgba(58,91,150,0.18), inset 0 2px 0 rgba(255,255,255,0.8);
      backdrop-filter: blur(6px);
      font-family: 'Press Start 2P', monospace;
      color: #1d2f42;
      pointer-events: none;
    }
    .score-side {
      display: flex; flex-direction: column; gap: 5px;
      min-width: 0; white-space: nowrap; text-align: center;
      font-size: 7px; line-height: 1.1;
    }
    .score-side strong {
      font-size: 16px; line-height: 1;
      text-shadow: 0 2px 0 rgba(255,255,255,0.9);
    }
    .score-side.dog strong { color: #248f34; }
    .score-side.monkey strong { color: #c64120; }
    .score-vs {
      width: 46px; height: 32px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: linear-gradient(145deg, #ffe75a, #ffb51e);
      box-shadow: inset 0 3px 0 rgba(255,255,255,0.55), inset 0 -4px 0 rgba(177,112,0,0.25);
      font-size: 9px;
    }
    #match-timer {
      grid-column: 1 / -1;
      position: relative;
      height: 16px;
      overflow: hidden;
      border: 2px solid rgba(80,40,50,0.34);
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      box-shadow: inset 0 2px 4px rgba(60,40,30,0.14);
    }
    #timer-fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff3a24 0%, #d90000 65%, #8a0000 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 0 12px rgba(255,0,0,0.32);
    }
    #timer-text {
      position: relative;
      display: grid; place-items: center;
      height: 100%;
      color: #2b1111;
      font-size: 7px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.82);
    }
    #item-toast {
      position: fixed; top: 66px; left: 50%;
      transform: translate(-50%, -6px) scale(0.94);
      z-index: 321;
      opacity: 0;
      max-width: min(520px, calc(100vw - 32px));
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(20,30,42,0.84);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; line-height: 1.55;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #item-toast.show {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    #power-block {
      position: fixed;
      width: 76px; height: 76px;
      z-index: 180;
      display: grid; place-items: center;
      color: rgba(255,255,255,0.94);
      font: 900 54px/1 system-ui, sans-serif;
      text-shadow: 0 4px 0 rgba(145,105,0,0.38);
      background: linear-gradient(145deg, #fff45a 0%, #ffd600 45%, #c99500 100%);
      border-radius: 9px;
      box-shadow:
        inset 9px 10px 14px rgba(255,255,255,0.52),
        inset -10px -13px 16px rgba(120,82,0,0.3),
        0 14px 24px rgba(45,55,30,0.24);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: opacity 0.18s ease, filter 0.18s ease;
      animation: powerBob 1.6s ease-in-out infinite;
    }
    #power-block::before {
      content: "";
      position: absolute; inset: 7px;
      border-radius: 7px;
      border: 2px solid rgba(255,255,255,0.22);
    }
    #power-block::after {
      content: "";
      position: absolute; width: 7px; height: 7px; left: 8px; top: 8px;
      border-radius: 50%;
      background: rgba(170,125,0,0.38);
      box-shadow: 53px 0 rgba(170,125,0,0.38), 0 53px rgba(170,125,0,0.38), 53px 53px rgba(170,125,0,0.38);
    }
    #power-block.hidden {
      opacity: 0;
      filter: saturate(0.4) blur(2px);
    }
    @keyframes powerBob {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -10px; }
    }

    /* ── 90s PIXEL GAME SKIN ── */
    body {
      background:
        linear-gradient(180deg, #0788f8 0 36%, #20b9ff 36% 58%, #66d84c 58% 100%);
      image-rendering: pixelated;
    }
    body::after {
      content: "";
      position: fixed; inset: 0;
      z-index: 490; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, rgba(0,0,0,0.03) 2px 4px),
        linear-gradient(90deg, rgba(255,255,255,0.05), rgba(0,0,0,0.04));
      mix-blend-mode: soft-light;
      opacity: 0.5;
    }
    #scene-bg {
      perspective: none;
      background:
        url('bg.png') center/cover no-repeat;
      image-rendering: pixelated;
    }
    #scene-bg::before {
      display: none; width: 72px; height: 36px; inset: 72px auto auto 74px;
      background: #fff;
      filter: none;
      box-shadow:
        36px 0 #fff, 72px 0 #e9f6ff, 108px 0 #d2e9ff,
        0 36px #d9efff, 36px 36px #fff, 72px 36px #fff,
        460px 22px #fff, 496px 22px #fff, 532px 22px #d9efff, 568px 22px #fff,
        424px 58px #d2e9ff, 460px 58px #fff, 496px 58px #fff,
        210px 128px #fff, 246px 128px #d9efff, 282px 128px #fff;
    }
    .hill {
      border-radius: 0;
      transform: none;
      box-shadow: none;
    }
    .hill.back {
      left: 30vw; bottom: 22vh; width: 42vw; height: 28vh;
      opacity: 1; filter: none;
      background:
        linear-gradient(135deg, transparent 0 28%, #bdf7ff 28% 46%, transparent 46%),
        linear-gradient(225deg, transparent 0 24%, #7edfff 24% 46%, transparent 46%),
        linear-gradient(180deg, #a8f1ff 0 55%, #47bdd8 55% 100%);
      clip-path: polygon(0 100%, 0 58%, 12% 58%, 12% 44%, 24% 44%, 24% 31%, 36% 31%, 36% 18%, 49% 18%, 49% 9%, 62% 9%, 62% 20%, 74% 20%, 74% 33%, 86% 33%, 86% 51%, 100% 51%, 100% 100%);
    }
    .hill.front {
      right: -5vw; bottom: 0; width: 36vw; height: 38vh;
      transform: none;
      border-radius: 0;
      background:
        linear-gradient(135deg, #b88b63 0 32%, #8a6249 32% 66%, #5b4439 66% 100%);
      clip-path: polygon(22% 100%, 22% 84%, 30% 84%, 30% 68%, 39% 68%, 39% 52%, 47% 52%, 47% 38%, 56% 38%, 56% 26%, 66% 26%, 66% 16%, 76% 16%, 76% 8%, 100% 8%, 100% 100%);
      box-shadow: -10px 0 0 #6b4c3b;
    }
    .grass {
      left: 0; right: 0; bottom: 0; height: 31vh;
      clip-path: none;
      background:
        repeating-linear-gradient(90deg, #36b01d 0 20px, #74f53f 20px 34px, #138719 34px 48px, #9cff4f 48px 64px),
        linear-gradient(180deg, #73f53c 0 18%, #24a020 18% 100%);
      box-shadow: inset 0 12px 0 #9cff4f, inset 0 -22px 0 #0d6319;
    }
    .grass::before {
      inset: -78px 0 auto 0; height: 86px;
      opacity: 1;
      transform: none;
      background:
        repeating-linear-gradient(90deg,
          transparent 0 10px, #78f53c 10px 22px, transparent 22px 34px,
          #26a91f 34px 46px, transparent 46px 60px, #a4ff54 60px 74px);
    }
    .stone {
      border-radius: 0;
      background: #b69773;
      box-shadow: inset -12px -12px 0 #5e4638, inset 10px 10px 0 #ead2a8;
      clip-path: polygon(0 100%, 0 35%, 18% 35%, 18% 18%, 36% 18%, 36% 0, 66% 0, 66% 18%, 84% 18%, 84% 36%, 100% 36%, 100% 100%);
    }
    .question-block,
    #power-block {
      border-radius: 0;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      background: #ffd414;
      text-shadow: 4px 4px 0 #b97a00;
      box-shadow:
        inset 8px 8px 0 #fff06b,
        inset -8px -8px 0 #b77d00,
        8px 8px 0 rgba(0,0,0,0.28);
    }
    .question-block::before,
    .question-block::after,
    #power-block::before,
    #power-block::after {
      border-radius: 0;
      border: 0;
      background: #b77d00;
      box-shadow: 52px 0 #b77d00, 0 52px #b77d00, 52px 52px #b77d00;
    }
    #power-block::before { display: none; }
    #power-block::after {
      width: 7px; height: 7px; left: 8px; top: 8px;
      box-shadow: 53px 0 #b77d00, 0 53px #b77d00, 53px 53px #b77d00;
    }
    .question-block.big {
      left: -22px; top: 24vh;
      width: 92px;
      transform: none;
      opacity: 1;
    }
    .question-block.mid {
      right: -18px; top: 44vh;
      width: 96px;
      transform: none;
      opacity: 1;
    }
    .question-block.ground { display: none; }
    .brick-stack {
      width: 128px; height: 80px;
      background:
        linear-gradient(90deg, transparent 0 30px, #2b1a15 30px 36px, transparent 36px 64px, #2b1a15 64px 70px, transparent 70px),
        repeating-linear-gradient(180deg, #8d4a2e 0 18px, #3a2118 18px 24px);
      box-shadow: inset 8px 8px 0 #d0783d, inset -8px -8px 0 #3a2118, 8px 8px 0 rgba(0,0,0,0.22);
      transform: none;
    }
    .palm {
      width: 12px; height: 128px;
      border-radius: 0;
      background: repeating-linear-gradient(180deg, #6b422a 0 14px, #4a2d22 14px 22px);
      box-shadow: 6px 0 0 #2a1a13;
      transform: rotate(-5deg);
    }
    .palm::before {
      width: 128px; height: 88px;
      background:
        linear-gradient(90deg, transparent 0 14%, #079447 14% 30%, transparent 30% 100%),
        linear-gradient(135deg, transparent 0 28%, #11bd54 28% 43%, transparent 43%),
        linear-gradient(45deg, transparent 0 40%, #086b40 40% 55%, transparent 55%);
      filter: none;
    }
    #score-board,
    #item-toast,
    #cam-wrap {
      border-radius: 0;
      border: 4px solid #4a2d1d;
      background: #c28851;
      box-shadow: 6px 6px 0 #28160d;
      color: #fff;
      backdrop-filter: none;
    }

<script type="module">
import { FaceLandmarker, FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

/* ════════════════════════════════════════════════════════════════════
   THEMES
   ════════════════════════════════════════════════════════════════════ */
const THEMES = {
  default:   { m1:'#f5d840', m2:'#c8a010', glowR:220, glowG:170, glowB: 10 },
  happy:     { m1:'#ff9030', m2:'#e06000', glowR:255, glowG:140, glowB:  0 },
  angry:     { m1:'#ff3a3a', m2:'#cc0000', glowR:240, glowG: 40, glowB: 40 },
  disgusted: { m1:'#7de040', m2:'#3da800', glowR: 80, glowG:210, glowB: 30 },
  surprised: { m1:'#60c8ff', m2:'#2080e0', glowR: 60, glowG:170, glowB:255 },
  sad:       { m1:'#e0e8f4', m2:'#90a8c8', glowR:160, glowG:180, glowB:220 },
};
let currentTheme = THEMES.default, currentEmotion = 'default';

function applyTheme(name) {
  const t = THEMES[name] || THEMES.default;
  document.getElementById('m1').setAttribute('stop-color', t.m1);
  document.getElementById('m2').setAttribute('stop-color', t.m2);
  currentTheme = t; currentEmotion = name;
  document.getElementById('emotion-tag').textContent = name;
}

/* ════════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════════ */
let dogX = innerWidth/2, dogY = innerHeight/2;
let mx   = innerWidth/2, my   = innerHeight/2;
let mode = 'idle', modeT = 0, breathT = 0;
let runTX = 0, runTY = 0;
let prevAngle = null, angleHist = [], spinAngle = 0, facingLeft = false;
let stretchX = 1.0;
const STRETCH_MAX = 3.8, STRETCH_RATE = 2.2;
let shakeOffsetX = 0;
let poopDropped   = false;  // for poop_squat
let sneezeCount   = 0;      // sneeze bursts fired
let handDetected  = false;
let handLandmarker = null;
let hand2X = innerWidth*0.75, hand2Y = innerHeight/2, hand2Detected = false;
let cloneMode = false, cloneT = 0;
let clones = [], cloneDivs = [];
const CLONE_DURATION = 5;
const MAX_SHIELD_USES = 3;
const MONKEY_SPEED = 750;
const CLONE_SPEED = 1260;
let shrinkMode = false, shrinkT = 0, shrinkScale = 1.0;
let shieldActive = false, shieldEl = null, shieldT = 0;
let shieldUses = 0;
let speedBoost = false, speedBoostT = 0;
let dogInvisible = false, invisibleT = 0;
let monkeyHaste = false, monkeyHasteT = 0;
let monkeyKnockedT = -1, monkeyKnockVX = 0, monkeyKnockVY = 0;
let monkeySlipping = false, monkeySlipT = 0, monkeySlipVX = 0, monkeySlipVY = 0;
let puddles = [];
let dogEvades = 0, monkeyCatches = 0;
let powerX = innerWidth / 2, powerY = innerHeight * 0.44;
let powerVX = 230, powerVY = 150, powerTurnT = 0;
let powerActive = true, powerCooldown = 0, powerGrace = 0.7, lastDogItem = '', lastMonkeyItem = '';
let powerSpawnReady = false;
const ROUND_TIME = 20;
let roundT = 0;

/* DOM */
const dogWrap   = document.getElementById('dog-wrap');
const dogSvg    = document.getElementById('dog-svg');
const cursorDot  = document.getElementById('cursor-dot');
const cursorDot2 = document.getElementById('cursor-dot2');
const dogScoreEl = document.getElementById('dog-score');
const monkeyScoreEl = document.getElementById('monkey-score');
const itemToast = document.getElementById('item-toast');
const powerBlock = document.getElementById('power-block');
const timerFill = document.getElementById('timer-fill');
const timerText = document.getElementById('timer-text');

/* ════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════ */
const DOG_HIT_W = 110, DOG_HIT_H = 55;
function isOnDog(x,y){ return Math.abs(x-dogX)<DOG_HIT_W && Math.abs(y-dogY)<DOG_HIT_H; }
function dv(ax,ay,bx,by){ return Math.hypot(ax-bx,ay-by); }
function pickRunTarget(){
  const p=120; runTX=p+Math.random()*(innerWidth-p*2); runTY=p+Math.random()*(innerHeight-p*2);
}
function setGlow(on){
  const {glowR:r,glowG:g,glowB:b}=currentTheme;
  dogSvg.style.filter=on
    ?`drop-shadow(0 0 24px rgba(${r},${g},${b},0.92)) drop-shadow(0 0 50px rgba(${r},${g},${b},0.50))`
    :`drop-shadow(0 8px 20px rgba(140,70,20,0.20))`;
}
function enterMode(m){
  if(mode===m && m!=='stunned') return;
  mode=m; modeT=0; shakeOffsetX=0; poopDropped=false; sneezeCount=0;
  if(m==='run'||m==='dislike_react'||m==='poop_run'){ if(m==='run')pickRunTarget(); setGlow(true); }
  else setGlow(false);
  if(m!=='spin') spinAngle=0;
}
function applyTransform({bounceY=0,rotation=0,scaleY=1,overrideX=null}={}){
  const fx=facingLeft?-1:1;
  const sx=overrideX!==null?overrideX:fx*stretchX;
  dogSvg.style.transform=`rotate(${rotation}deg) translateY(${bounceY}px) scale(${sx*shrinkScale},${scaleY*shrinkScale})`;
}
function updateScore(){
  dogScoreEl.textContent=dogEvades;
  monkeyScoreEl.textContent=monkeyCatches;
}
function showItemToast(text){
  itemToast.textContent=text;
  itemToast.classList.add('show');
  clearTimeout(showItemToast.timer);
  showItemToast.timer=setTimeout(()=>itemToast.classList.remove('show'),1500);
}
function activateShield(countUse=true){
  if(countUse){
    if(shieldUses>=MAX_SHIELD_USES) return false;
    shieldUses++;
  }
  shieldActive=true; shieldT=0;
  if(!shieldEl){
    shieldEl=document.createElement('div');
    shieldEl.id='shield-bubble';
    document.body.appendChild(shieldEl);
  }
  shieldEl.style.left=dogX+'px'; shieldEl.style.top=dogY+'px';
  return true;
}
function addDogEvade(reason){
  dogEvades++;
  updateScore();
  showItemToast(reason||'DOG EVADED');
}
function addMonkeyCatch(){
  monkeyCatches++;
  updateScore();
}
function updateTimer(){
  const progress=Math.min(1,roundT/ROUND_TIME);
  timerFill.style.width=(progress*100).toFixed(1)+'%';
  timerText.textContent='MONKEY TIME '+Math.max(0,ROUND_TIME-roundT).toFixed(1);
}
function completeDogRound(){
  addDogEvade('DOG WINS: +1');
  roundT=0;
  updateTimer();
}

/* ════════════════════════════════════════════════════════════════════
   INPUT
   ════════════════════════════════════════════════════════════════════ */

/* Keyboard state */
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  const key=e.key.toLowerCase();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','r','t','n'].includes(e.key)||key==='n') e.preventDefault();
  if(key==='n'&&!cloneMode) startClones();
  if(e.key==='r'&&!shrinkMode) startShrink();
  if(key==='t'&&!shieldActive&&shieldUses<MAX_SHIELD_USES) startShield();
});
document.addEventListener('keyup',e=>{ keys[e.key]=false; });

/* Circle detector */
function detectCircle(){
  const dx=mx-dogX, dy=my-dogY, dist=Math.hypot(dx,dy);
  if(dist<70||dist>260){ angleHist=[]; prevAngle=null; return false; }
  const angle=Math.atan2(dy,dx);
  if(prevAngle!==null){
    let d=angle-prevAngle;
    if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI;
    angleHist.push(d); if(angleHist.length>44)angleHist.shift();
    if(Math.abs(angleHist.reduce((a,b)=>a+b,0))>Math.PI*1.7)return true;
  }
  prevAngle=angle; return false;
}

/* ════════════════════════════════════════════════════════════════════
   ANIMATION LOOP
   ════════════════════════════════════════════════════════════════════ */
let prevTS=0;
function frame(ts){
  const dt=Math.min((ts-prevTS)/1000,0.05);
  prevTS=ts; modeT+=dt; breathT+=dt;
  roundT+=dt;
  if(roundT>=ROUND_TIME) completeDogRound();
  else updateTimer();

  stretchX+=(1.0-stretchX)*0.10;
  if(Math.abs(stretchX-1.0)<0.005)stretchX=1.0;

  if(mode==='idle')          tickIdle(dt);
  if(mode==='run')           tickRun(dt);
  if(mode==='belly')         tickBelly(dt);
  if(mode==='spin')          tickSpin(dt);
  if(mode==='happy_react')   tickHappyReact(dt);
  if(mode==='dislike_react') tickDislikeReact(dt);
  if(mode==='poop_run')      tickPoopRun(dt);
  if(mode==='poop_squat')    tickPoopSquat(dt);
  if(mode==='sneeze')        tickSneeze(dt);
  if(mode==='stunned')       tickStunned(dt);
  tickMonkey(dt);
  tickClones(dt);
  tickPowerBlock(dt);
  if(shrinkMode){ shrinkT+=dt; if(shrinkT>=5){ shrinkMode=false; shrinkScale=1.0; } }
  if(shieldActive){ shieldT+=dt; if(shieldT>=4){ shieldActive=false; if(shieldEl){shieldEl.remove();shieldEl=null;} } }
  if(shieldEl){ shieldEl.style.left=dogX+'px'; shieldEl.style.top=dogY+'px'; }
  if(speedBoost){ speedBoostT+=dt; if(speedBoostT>=3){ speedBoost=false; } }
  if(dogInvisible){ invisibleT+=dt; if(invisibleT>=2.5){ dogInvisible=false; dogWrap.style.opacity='1'; } }
  if(monkeyHaste){ monkeyHasteT+=dt; if(monkeyHasteT>=3){ monkeyHaste=false; } }
  if(monkeyKnockedT>=0){ monkeyKnockedT+=dt; if(monkeyKnockedT>1.3) monkeyKnockedT=-1; }

  dogWrap.style.left=(dogX+shakeOffsetX)+'px';
  dogWrap.style.top=dogY+'px';
  requestAnimationFrame(frame);
}

function tickIdle(dt){
  const spd=(speedBoost?1000:500)*dt;
  if(keys['w']) dogY-=spd;
  if(keys['s']) dogY+=spd;
  if(keys['a']){ dogX-=spd; facingLeft=true; }
  if(keys['d']){ dogX+=spd; facingLeft=false; }
  dogX=Math.max(60,Math.min(innerWidth-60,dogX));
  dogY=Math.max(60,Math.min(innerHeight-60,dogY));
  const b=1+Math.sin(breathT*1.55)*0.018;
  applyTransform({scaleY:b});
}

function placePowerBlock(){
  for(let tries=0;tries<12;tries++){
    powerX=120+Math.random()*Math.max(80,innerWidth-240);
    powerY=170+Math.random()*Math.max(80,innerHeight-300);
    if(!powerSpawnReady||Math.hypot(powerX-dogX,powerY-dogY)>190&&Math.hypot(powerX-monkeyX,powerY-monkeyY)>170) break;
  }
  const angle=Math.random()*Math.PI*2;
  const speed=240+Math.random()*140;
  powerVX=Math.cos(angle)*speed;
  powerVY=Math.sin(angle)*speed;
  powerTurnT=0.45+Math.random()*0.8;
  powerBlock.style.left=powerX+'px';
  powerBlock.style.top=powerY+'px';
  powerBlock.classList.remove('hidden');
  powerActive=true;
  powerGrace=1.15;
}

function chooseItem(owner,pool){
  const last=owner==='dog'?lastDogItem:lastMonkeyItem;
  const choices=pool.length>1?pool.filter(item=>item.id!==last):pool;
  const item=choices[Math.floor(Math.random()*choices.length)];
  if(owner==='dog') lastDogItem=item.id;
  else lastMonkeyItem=item.id;
  return item;
}

function awardDogItem(){
  const danger=Math.hypot(monkeyX-dogX,monkeyY-dogY)<260||monkeyMode==='chasing'||cloneMode;
  const pool=[
    {id:'turbo',label:'DOG ITEM: TURBO RUN',run:()=>{ speedBoost=true; speedBoostT=0; }},
    {id:'ghost',label:'DOG ITEM: GHOST DODGE',run:()=>{ dogInvisible=true; invisibleT=0; dogWrap.style.opacity='0.12'; }},
    {id:'tiny',label:'DOG ITEM: TINY ESCAPE',run:()=>{ shrinkMode=true; shrinkT=0; shrinkScale=1/3; }},
    {id:'warp',label:'DOG ITEM: SAFE WARP',run:()=>{
      dogX=80+Math.random()*(innerWidth-160);
      dogY=110+Math.random()*(innerHeight-220);
      burstAt(dogX,dogY,'#70e030',14,6);
    }},
    {id:'blast',label:'DOG ITEM: PEPPER BLAST',run:()=>{ knockbackMonkeys(); burstAt(dogX,dogY,'rgba(230,230,230,0.9)',18,8); }},
  ];
  if(danger) pool.push({id:'bubble',label:'DOG ITEM: FREE BUBBLE',run:()=>activateShield(false)});
  const item=chooseItem('dog',pool);
  item.run();
  showItemToast(item.label);
}

function awardMonkeyItem(){
  const far=Math.hypot(monkeyX-dogX,monkeyY-dogY)>310;
  const pool=[
    {id:'haste',label:'MONKEY ITEM: HYPER CHASE',run:()=>{ monkeyHaste=true; monkeyHasteT=0; }},
    {id:'clone',label:'MONKEY ITEM: CLONE RUSH',run:()=>{ if(!cloneMode) startClones(); else { monkeyHaste=true; monkeyHasteT=0; } }},
    {id:'reveal',label:'MONKEY ITEM: REVEAL DOG',run:()=>{ dogInvisible=false; dogWrap.style.opacity='1'; shieldActive=false; if(shieldEl){shieldEl.remove();shieldEl=null;} }},
    {id:'magnet',label:'MONKEY ITEM: CLOSER!',run:()=>{
      const dx=dogX-monkeyX, dy=dogY-monkeyY, d=Math.hypot(dx,dy)||1;
      monkeyX+=dx/d*(far?180:100);
      monkeyY+=dy/d*(far?180:100);
    }},
    {id:'trap',label:'MONKEY ITEM: MUSTARD TRAP',run:()=>{ puddles.push({x:dogX,y:dogY,r:92,life:1}); }},
  ];
  const item=chooseItem('monkey',pool);
  item.run();
  showItemToast(item.label);
}

function collectPowerBlock(owner){
  powerActive=false;
  powerCooldown=2.8;
  powerBlock.classList.add('hidden');
  burstAt(powerX,powerY,owner==='dog'?'#7dff4a':'#ff633a',18,7);
  if(owner==='dog') awardDogItem();
  else awardMonkeyItem();
}

function tickPowerBlock(dt){
  if(!powerActive){
    powerCooldown-=dt;
    if(powerCooldown<=0) placePowerBlock();
    return;
  }
  powerTurnT-=dt;
  if(powerTurnT<=0){
    const angle=Math.atan2(powerVY,powerVX)+(Math.random()-0.5)*1.25;
    const speed=Math.min(460,Math.max(230,Math.hypot(powerVX,powerVY)+(Math.random()-0.5)*120));
    powerVX=Math.cos(angle)*speed;
    powerVY=Math.sin(angle)*speed;
    powerTurnT=0.5+Math.random()*0.9;
  }
  const margin=72;
  powerX+=powerVX*dt;
  powerY+=powerVY*dt;
  if(powerX<margin){ powerX=margin; powerVX=Math.abs(powerVX); }
  if(powerX>innerWidth-margin){ powerX=innerWidth-margin; powerVX=-Math.abs(powerVX); }
  if(powerY<170){ powerY=170; powerVY=Math.abs(powerVY); }
  if(powerY>innerHeight-margin){ powerY=innerHeight-margin; powerVY=-Math.abs(powerVY); }
  powerBlock.style.left=powerX+'px';
  powerBlock.style.top=powerY+'px';
  powerGrace=Math.max(0,powerGrace-dt);
  if(powerGrace>0) return;
  const dogD=Math.hypot(dogX-powerX,dogY-powerY);
  const monkeyD=Math.hypot(monkeyX-powerX,monkeyY-powerY);
  if(dogD<76||monkeyD<64){
    collectPowerBlock(dogD<=monkeyD?'dog':'monkey');
  }
}

function tickRun(dt){
  const dx=runTX-dogX, dy=runTY-dogY;
  if(Math.hypot(dx,dy)<28)pickRunTarget();
  dogX+=dx*0.20; dogY+=dy*0.20; facingLeft=dx<0;
  const ph=modeT*9;
  applyTransform({bounceY:-(Math.abs(Math.sin(ph))*14), scaleY:1+Math.abs(Math.sin(ph))*0.12});
  if(modeT>3.6){ enterMode('idle'); applyTransform({}); }
}
function tickBelly(dt){
  dogX+=(mx-dogX)*0.015; dogY+=(my-dogY)*0.015;
  applyTransform({rotation:88+Math.sin(modeT*7)*8, overrideX:0.88, scaleY:0.88});
}
function tickSpin(dt){
  spinAngle+=dt*540;
  applyTransform({rotation:spinAngle});
  if(modeT>1.5){ angleHist=[]; prevAngle=null; enterMode('idle'); applyTransform({}); }
}
function tickHappyReact(dt){
  dogX+=(mx-dogX)*0.03; dogY+=(my-dogY)*0.03;
  const ph=modeT*9;
  applyTransform({bounceY:-(Math.abs(Math.sin(ph))*20), scaleY:1+Math.abs(Math.sin(ph))*0.14});
  if(modeT>2.0){ enterMode('idle'); applyTheme('default'); }
}
function tickDislikeReact(dt){
  dogX+=(mx-dogX)*0.03; dogY+=(my-dogY)*0.03;
  const decay=Math.max(0,1-modeT/1.4);
  shakeOffsetX=Math.sin(modeT*38)*10*decay;
  applyTransform({rotation:Math.sin(modeT*32)*5*decay});
  if(modeT>1.6){ shakeOffsetX=0; setGlow(false); enterMode('idle'); applyTheme('default'); }
}

/* ── POOP RUN (wasabi) — runs frantically leaving green poop ── */
function tickPoopRun(dt){
  const dx=runTX-dogX, dy=runTY-dogY;
  if(Math.hypot(dx,dy)<28)pickRunTarget();
  dogX+=dx*0.24; dogY+=dy*0.24; facingLeft=dx<0;
  const ph=modeT*11;
  applyTransform({bounceY:-(Math.abs(Math.sin(ph))*16), scaleY:1+Math.abs(Math.sin(ph))*0.15});

  // Drop poop every ~0.42 s
  const interval=0.42;
  if(Math.floor(modeT/interval)>Math.floor((modeT-dt)/interval)){
    spawnPoop(
      dogX + (facingLeft?1:-1)*50 + (Math.random()-0.5)*16,
      dogY + 46 + (Math.random()-0.5)*8,
      '#3d7a12'
    );
  }
  if(modeT>4.2){ enterMode('idle'); applyTransform({}); applyTheme('default'); }
}

/* ── POOP SQUAT (soy sauce) — squats and drops brown poop ── */
function tickPoopSquat(dt){
  dogX+=(mx-dogX)*0.02; dogY+=(my-dogY)*0.02;
  if(modeT<0.55){
    const t=modeT/0.55;
    const sq=Math.sin(t*Math.PI)*0.28;
    applyTransform({scaleY:1-sq, bounceY:sq*28, overrideX:(facingLeft?-1:1)*stretchX});
  } else {
    if(!poopDropped){
      poopDropped=true;
      spawnPoop(dogX+(facingLeft?30:-30), dogY+52, '#3d1e08');
      spawnPoop(dogX+(facingLeft?45:-15)+(Math.random()-0.5)*14, dogY+50, '#2e1606');
    }
    const t=Math.min((modeT-0.55)/0.55,1);
    const bounce=Math.sin(t*Math.PI)*0.12;
    applyTransform({scaleY:1+bounce*0.5, bounceY:-bounce*14, overrideX:(facingLeft?-1:1)*stretchX});
  }
  if(modeT>1.8){ enterMode('idle'); applyTransform({}); applyTheme('default'); }
}

/* ── SNEEZE (pepper) — head bobs + spray particles ── */
function tickSneeze(dt){
  dogX+=(mx-dogX)*0.02; dogY+=(my-dogY)*0.02;
  const decay=Math.max(0,1-modeT/1.3);
  const phase=modeT*22;
  const bob=Math.sin(phase)*14*decay;
  const faceDir=facingLeft?1:-1;   // which way the face points
  shakeOffsetX=bob*faceDir;

  applyTransform({
    scaleY: 1+Math.abs(Math.sin(phase))*0.08*decay,
    overrideX: (facingLeft?-1:1)*stretchX
  });

  // Fire sneeze particle burst at each peak
  const burstThresh=0.88;
  const prevPhase=(modeT-dt)*22;
  const peakNow = Math.sin(phase)>burstThresh;
  const peakPrev= Math.sin(prevPhase)>burstThresh;
  if(peakNow&&!peakPrev&&sneezeCount<5&&decay>0.15){
    sneezeCount++;
    const originX=dogX+faceDir*90;
    const originY=dogY-8;
    for(let i=0;i<10;i++){
      const angle=(faceDir>0?0:Math.PI)+(Math.random()-0.5)*0.9;
      const spd=5+Math.random()*5;
      particles.push(new Particle(
        originX+(Math.random()-0.5)*18,
        originY+(Math.random()-0.5)*18,
        Math.cos(angle)*spd, Math.sin(angle)*spd-1.5,
        `rgba(${215+Math.floor(Math.random()*40)},${215+Math.floor(Math.random()*40)},${215+Math.floor(Math.random()*40)},0.85)`,
        2+Math.random()*2.8
      ));
    }
    // Tiny dark pepper specks
    for(let i=0;i<5;i++){
      const angle=(faceDir>0?0:Math.PI)+(Math.random()-0.5)*1.1;
      const spd=3+Math.random()*3;
      particles.push(new Particle(
        originX+(Math.random()-0.5)*10,
        originY+(Math.random()-0.5)*10,
        Math.cos(angle)*spd, Math.sin(angle)*spd,
        `rgba(30,20,10,0.80)`, 1.5+Math.random()*1.5
      ));
    }
  }

  if(modeT>1.6){ shakeOffsetX=0; enterMode('idle'); applyTransform({}); applyTheme('default'); }
}

const pCanvas=document.getElementById('particle-canvas');
const pCtx=pCanvas.getContext('2d');

class Particle{
  constructor(x,y,vx,vy,color,r){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.r=r;
    this.life=1.0; this.decay=0.013+Math.random()*0.018;
  }
  update(){ this.x+=this.vx;this.y+=this.vy;this.vy+=0.28;this.vx*=0.97;this.life-=this.decay; }
  draw(ctx){
    ctx.save(); ctx.globalAlpha=Math.max(0,this.life*this.life);
    ctx.fillStyle=this.color; ctx.beginPath();
    ctx.arc(this.x,this.y,this.r*Math.max(0.2,this.life),0,Math.PI*2); ctx.fill();
    ctx.globalAlpha*=0.45; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.beginPath();
    ctx.arc(this.x-this.r*.3,this.y-this.r*.35,this.r*.32,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  isDead(){ return this.life<=0; }
}

class Poop{
  constructor(x,y,color){
    this.x=x; this.y=y; this.color=color;
    this.life=1.0; this.decay=0.0028;
    this.size=9+Math.random()*4;
    this.tilt=(Math.random()-0.5)*0.4;
  }
  update(){ this.life-=this.decay; }
  draw(ctx){
    const {x,y,size:s,color:c,tilt}=this;
    ctx.save();
    ctx.translate(x,y); ctx.rotate(tilt);
    ctx.globalAlpha=Math.min(1,this.life*4);

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, s*3.4, s*1.1, s*0.38, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle=c;
    // Bottom tier
    ctx.beginPath(); ctx.ellipse(0, s*2.5, s*1.05, s*0.72, 0, 0, Math.PI*2); ctx.fill();
    // Middle tier
    ctx.beginPath(); ctx.ellipse(s*0.1, s*1.3, s*0.82, s*0.60, 0, 0, Math.PI*2); ctx.fill();
    // Upper tier
    ctx.beginPath(); ctx.ellipse(0, s*0.3, s*0.60, s*0.50, 0, 0, Math.PI*2); ctx.fill();
    // Tip swirl
    ctx.beginPath(); ctx.ellipse(s*0.05, -s*0.5, s*0.35, s*0.42, 0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.0, -s*1.1, s*0.18, s*0.22, 0, 0, Math.PI*2); ctx.fill();

    // Shine
    const shimmer=c==='#3d7a12'?'rgba(180,255,100,0.22)':'rgba(180,100,40,0.18)';
    ctx.fillStyle=shimmer;
    ctx.beginPath(); ctx.ellipse(-s*0.4, s*2.0, s*0.28, s*0.16, -0.5, 0, Math.PI*2); ctx.fill();

    // Tiny eyes
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.arc(-s*0.28, s*2.38, s*0.14, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.28, s*2.38, s*0.14, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }
  isDead(){ return this.life<=0; }
}

let particles=[], poops=[];

function burstAt(x,y,color,count,speed=4){
  for(let i=0;i<count;i++){
    const angle=(i/count)*Math.PI*2+Math.random()*0.5;
    const spd=speed*(0.6+Math.random()*0.8);
    particles.push(new Particle(
      x+(Math.random()-.5)*20, y+(Math.random()-.5)*14,
      Math.cos(angle)*spd, Math.sin(angle)*spd-1.5,
      color, 3.5+Math.random()*3
    ));
  }
}

function spawnPoop(x,y,color){
  poops.push(new Poop(x,y,color));
}

function renderLoop(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  // Draw mustard puddles
  puddles=puddles.filter(p=>p.life>0);
  for(const p of puddles){
    p.life-=0.00012;
    pCtx.save();
    pCtx.globalAlpha=Math.min(1,p.life)*0.55;
    pCtx.fillStyle='#f5d840';
    pCtx.beginPath();
    pCtx.ellipse(p.x,p.y,p.r,p.r*0.42,0,0,Math.PI*2);
    pCtx.fill();
    pCtx.globalAlpha=Math.min(1,p.life)*0.25;
    pCtx.strokeStyle='#c8a010';
    pCtx.lineWidth=3;
    pCtx.stroke();
    pCtx.restore();
  }
  poops=poops.filter(p=>!p.isDead());
  for(const p of poops){ p.update(); p.draw(pCtx); }
  particles=particles.filter(p=>!p.isDead());
  for(const p of particles){ p.update(); p.draw(pCtx); }
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

function knockbackMonkeys(){
  // 원래 원숭이
  const dx=monkeyX-dogX, dy=monkeyY-dogY, d=Math.hypot(dx,dy)||1;
  monkeyKnockVX=(dx/d)*480; monkeyKnockVY=(dy/d)*480; monkeyKnockedT=0;
  // 클론들
  clones.forEach(c=>{
    const cx=c.x-dogX, cy=c.y-dogY, cd=Math.hypot(cx,cy)||1;
    c.knockVX=(cx/cd)*480; c.knockVY=(cy/cd)*480; c.knockedT=0;
  });
}

function triggerReaction(cond){
  if(reactionFired)return;
  reactionFired=true; activeCondiment=null;
  document.querySelectorAll('.bottle-wrap').forEach(b=>b.classList.remove('pouring'));

  switch(cond){
    case 'ketchup': // 속도 부스트 3초
      speedBoost=true; speedBoostT=0;
      burstAt(dogX,dogY,'#ff5060',14,6);
      burstAt(dogX,dogY,'#ff9090',8,4);
      break;
    case 'mustard': // 미끄러운 웅덩이 생성
      puddles.push({x:dogX, y:dogY, r:80, life:1});
      burstAt(dogX,dogY,'#f5d840',14,5);
      burstAt(dogX,dogY,'#ffee80',8,3);
      break;
    case 'wasabi': // 랜덤 순간이동
      burstAt(dogX,dogY,'#70e030',12,5);
      dogX=80+Math.random()*(innerWidth-160);
      dogY=80+Math.random()*(innerHeight-160);
      burstAt(dogX,dogY,'#70e030',14,6);
      break;
    case 'soy': // 투명화 2.5초
      dogInvisible=true; invisibleT=0;
      dogWrap.style.opacity='0.12';
      burstAt(dogX,dogY,'rgba(30,20,10,0.9)',10,4);
      break;
    case 'pepper': // 넉백 폭발
      burstAt(dogX,dogY,'rgba(220,220,220,0.9)',20,9);
      burstAt(dogX,dogY,'rgba(180,180,180,0.7)',12,6);
      knockbackMonkeys();
      break;
  }
}

function hitDog(){

  if(shieldActive){

  if(['belly','stunned'].includes(mode)) return;

  burstAt(dogX, dogY-20, '#FFEE00', 10, 6);
  burstAt(dogX, dogY-20, '#FF8800', 8,  4);

function checkPuddle(x,y){
  for(const p of puddles) if(Math.hypot(x-p.x,y-p.y)<p.r) return true;
  return false;
}

function tickMonkey(dt){
  mkT+=dt; sirenT+=dt;

  // 넉백 중이면 날아가고 종료
  if(monkeyKnockedT>=0){
    monkeyX+=monkeyKnockVX*dt; monkeyY+=monkeyKnockVY*dt;
    monkeyKnockVX*=0.80; monkeyKnockVY*=0.80;
    monkeyX=Math.max(0,Math.min(innerWidth,monkeyX));
    monkeyY=Math.max(0,Math.min(innerHeight,monkeyY));
    monkeySvg.style.transform=`scaleX(${mkFacing}) rotate(${mkT*600}deg)`;
    monkeyWrap.style.left=monkeyX+'px'; monkeyWrap.style.top=monkeyY+'px';
    return;
  }
  // 미끄러짐 중이면 슬라이드
  if(monkeySlipping){
    monkeySlipT+=dt;
    monkeyX+=monkeySlipVX*dt; monkeyY+=monkeySlipVY*dt;
    monkeySlipVX*=0.88; monkeySlipVY*=0.88;
    monkeyX=Math.max(0,Math.min(innerWidth,monkeyX));
    monkeyY=Math.max(0,Math.min(innerHeight,monkeyY));
    monkeySvg.style.transform=`scaleX(${mkFacing}) rotate(${Math.sin(monkeySlipT*18)*20}deg)`;
    monkeyWrap.style.left=monkeyX+'px'; monkeyWrap.style.top=monkeyY+'px';
    if(monkeySlipT>1.5) monkeySlipping=false;
    return;
  }

  const chasing=['spinning','chasing','hitting'].includes(monkeyMode);
  monkeyWrap.style.pointerEvents=monkeyMode==='idle'?'auto':'none';

  // Siren flash
  const sg=document.getElementById('mk-siren-glow');
  if(sg){
    const sa=chasing?(Math.sin(sirenT*9)*0.5+0.5)*0.65:0;
    sg.setAttribute('opacity', sa.toFixed(3));
    sg.setAttribute('fill', `rgba(255,40,0,${sa.toFixed(3)})`);
    monkeySvg.style.filter=chasing
      ?`drop-shadow(0 0 ${(sa*18).toFixed(1)}px rgba(255,60,0,${(sa*0.7).toFixed(2)})) drop-shadow(0 6px 16px rgba(0,0,0,0.20))`
      :`drop-shadow(0 6px 16px rgba(0,0,0,0.20))`;
  }

  switch(monkeyMode){
    case 'idle':{
      monkeyX=mkHomeX(); monkeyY=mkHomeY()+Math.sin(mkT*1.6)*3;
      mkFacing=-1;
      monkeySvg.style.transform=`scaleX(-1)`;
      if(keys['ArrowUp']||keys['ArrowDown']||keys['ArrowLeft']||keys['ArrowRight']) enterMonkeyMode('chasing');
      break;
    }
    case 'spinning':{
      mkSpinAngle+=dt*820;
      monkeySvg.style.transform=`scaleX(-1) rotate(${mkSpinAngle}deg)`;
      if(mkT>0.9) enterMonkeyMode('chasing');
      break;
    }
    case 'chasing':{
      const chaseSpeed=MONKEY_SPEED*(monkeyHaste?1.65:1);
      if(cloneMode){
        const dx=dogX-monkeyX, dy=dogY-monkeyY, dist=Math.hypot(dx,dy);
        mkFacing=dx>=0?1:-1;
        if(dist>58){ monkeyX+=(dx/dist)*chaseSpeed*dt; monkeyY+=(dy/dist)*chaseSpeed*dt; }
        else { enterMonkeyMode('hitting'); break; }
        const bY=-(Math.abs(Math.sin(mkT*11))*14);
        monkeySvg.style.transform=`scaleX(${mkFacing}) translateY(${bY}px)`;
        break;
      }
      const spd=chaseSpeed*dt;
      if(keys['ArrowUp']) monkeyY-=spd;
      if(keys['ArrowDown']) monkeyY+=spd;
      if(keys['ArrowLeft']){ monkeyX-=spd; mkFacing=-1; }
      if(keys['ArrowRight']){ monkeyX+=spd; mkFacing=1; }
      monkeyX=Math.max(0,Math.min(innerWidth,monkeyX));
      monkeyY=Math.max(0,Math.min(innerHeight,monkeyY));
      if(!keys['ArrowLeft']&&!keys['ArrowRight']) mkFacing=(dogX-monkeyX)>=0?1:-1;
      // 웅덩이 밟으면 미끄러짐
      if(checkPuddle(monkeyX,monkeyY)){
        const pdx=dogX-monkeyX, pdy=dogY-monkeyY, pd=Math.hypot(pdx,pdy)||1;
        monkeySlipping=true; monkeySlipT=0;
        monkeySlipVX=(pdx/pd)*360; monkeySlipVY=(pdy/pd)*360;
        break;
      }
      const ddx=dogX-monkeyX, ddy=dogY-monkeyY;
      if(Math.hypot(ddx,ddy)<(shrinkMode?22:58)){ enterMonkeyMode('hitting'); break; }
      const bY=-(Math.abs(Math.sin(mkT*11))*14);
      monkeySvg.style.transform=`scaleX(${mkFacing}) translateY(${bY}px)`;
      break;
    }
    case 'hitting':{
      const prog=Math.min(mkT/0.55,1);
      const lunge=Math.sin(prog*Math.PI)*(mkFacing>0?32:-32);
      const bY=-Math.sin(prog*Math.PI)*12;
      monkeySvg.style.transform=`scaleX(${mkFacing}) rotate(${lunge}deg) translateY(${bY}px)`;
      if(!mkHitDone&&mkT>0.22){ mkHitDone=true; hitDog(); }
      if(mkT>0.78) enterMonkeyMode(cloneMode?'chasing':'returning');
      break;
    }
    case 'returning':{
      const dx=mkHomeX()-monkeyX, dy=mkHomeY()-monkeyY;
      monkeyX+=dx*0.10; monkeyY+=dy*0.10;
      mkFacing=dx>=0?1:-1;
      const bY=-(Math.abs(Math.sin(mkT*9))*8);
      monkeySvg.style.transform=`scaleX(${mkFacing}) translateY(${bY}px)`;
      if(Math.hypot(dx,dy)<5){ monkeyX=mkHomeX(); monkeyY=mkHomeY(); enterMonkeyMode('idle'); }
      break;
    }
  }
  monkeyWrap.style.left=monkeyX+'px';
  monkeyWrap.style.top=monkeyY+'px';
}

function startShrink(){
  shrinkMode=true; shrinkT=0; shrinkScale=1/3;
}

function startShield(){
  activateShield(true);
}

function startClones(){
  cloneMode=true; cloneT=0;
  // 화면 세 귀퉁이에서 출발
  const starts=[
    {x:80,               y:80},
    {x:innerWidth-80,    y:80},
    {x:innerWidth/2,     y:innerHeight-80},
  ];
  clones=starts.map((p,i)=>({
    x:p.x, y:p.y,
    facing:-1, hitting:false, hitT:0, hitDone:false,
    baseAngle:(i/3)*Math.PI*2,
    knockVX:0, knockVY:0, knockedT:-1
  }));
  cloneDivs=clones.map(()=>{
    const el=monkeyWrap.cloneNode(true);
    el.removeAttribute('id');
    el.style.position='fixed';
    el.style.pointerEvents='none';
    el.style.opacity='0.9';
    el.style.filter='hue-rotate(140deg) brightness(1.2)';
    document.body.appendChild(el);
    return el;
  });
  burstAt(monkeyX,monkeyY,'#FF4400',18,7);
  if(monkeyMode!=='chasing') enterMonkeyMode('chasing');
}

function tickClones(dt){
  if(!cloneMode) return;
  cloneT+=dt;
  const cloneSpeed=CLONE_SPEED*(monkeyHaste?1.35:1);
  for(let i=0;i<clones.length;i++){
    const c=clones[i], el=cloneDivs[i];
    const svg=el.querySelector('svg');
    // 클론 넉백
    if(c.knockedT>=0){
      c.knockedT+=dt;
      c.x+=c.knockVX*dt; c.y+=c.knockVY*dt;
      c.knockVX*=0.80; c.knockVY*=0.80;
      c.x=Math.max(0,Math.min(innerWidth,c.x));
      c.y=Math.max(0,Math.min(innerHeight,c.y));
      if(svg) svg.style.transform=`scaleX(${c.facing}) rotate(${c.knockedT*600}deg)`;
      el.style.left=c.x+'px'; el.style.top=c.y+'px';
      if(c.knockedT>1.3) c.knockedT=-1;
      continue;
    }
    if(c.hitting){
      c.hitT+=dt;
      const prog=Math.min(c.hitT/0.45,1);
      const lunge=Math.sin(prog*Math.PI)*(c.facing>0?36:-36);
      const bY=-Math.sin(prog*Math.PI)*12;
      if(svg) svg.style.transform=`scaleX(${c.facing}) rotate(${lunge}deg) translateY(${bY}px)`;
      if(!c.hitDone&&c.hitT>0.18){ c.hitDone=true; hitDog(); }
      if(c.hitT>0.65){ c.hitting=false; c.hitT=0; c.hitDone=false; }
    } else {
      // 포위 반경: 처음엔 넓게 벌렸다가 3초 이후 완전히 좁힘
      const flankR=Math.max(0, 110*(1-cloneT/3));
      const flankAngle=c.baseAngle+cloneT*1.4;
      const targetX=dogX+Math.cos(flankAngle)*flankR;
      const targetY=dogY+Math.sin(flankAngle)*flankR;
      const dx=targetX-c.x, dy=targetY-c.y, dist=Math.hypot(dx,dy);
      c.facing=(dogX-c.x)>=0?1:-1;
      if(checkPuddle(c.x,c.y)){
        c.knockVX=(dx/dist)*360; c.knockVY=(dy/dist)*360; c.knockedT=0;
      } else if(dist>(shrinkMode?20:52)){ c.x+=(dx/dist)*cloneSpeed*dt; c.y+=(dy/dist)*cloneSpeed*dt; }
      else { c.hitting=true; c.hitT=0; c.hitDone=false; }
      // 빠른 달리기 바운스
      const bY=-(Math.abs(Math.sin((cloneT*14)+i*2.1))*16);
      if(svg) svg.style.transform=`scaleX(${c.facing}) translateY(${bY}px)`;
    }
    // 화면 안으로 clamp
    c.x=Math.max(0,Math.min(innerWidth,c.x));
    c.y=Math.max(0,Math.min(innerHeight,c.y));
    el.style.left=c.x+'px';
    el.style.top=c.y+'px';
  }
  if(cloneT>=CLONE_DURATION){
    cloneDivs.forEach(el=>el.remove());
    cloneDivs=[]; clones=[];
    cloneMode=false;
    enterMonkeyMode('returning');
  }
}

monkeyWrap.addEventListener('click',e=>{
  e.stopPropagation();
  if(monkeyMode==='idle') enterMonkeyMode('spinning');
});
monkeyWrap.addEventListener('mousedown',e=>e.stopPropagation());
monkeyWrap.addEventListener('touchstart',e=>{
  e.stopPropagation();
  if(monkeyMode==='idle') enterMonkeyMode('spinning');
},{passive:true});

/* ════════════════════════════════════════════════════════════════════
   MEDIAPIPE
   ════════════════════════════════════════════════════════════════════ */
async function initFace(){
  let fl;
  try{
    const fsr=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
    );
    fl=await FaceLandmarker.createFromOptions(fsr,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      outputFaceBlendshapes:true, runningMode:"VIDEO", numFaces:1
    });
    handLandmarker=await HandLandmarker.createFromOptions(fsr,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO", numHands:2
    });
  }catch(e){ console.warn("[face]",e); camWrap.style.display='none'; return; }

  const video=document.getElementById('webcam');
  try{
    video.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}});
    await new Promise(r=>video.addEventListener('loadeddata',r,{once:true}));
  }catch(e){ console.warn("[cam]",e); camWrap.style.display='none'; return; }

  let lastT=-1,tick=0;
  function detect(){
    tick++;
    if(tick%6===0&&video.currentTime!==lastT){
      lastT=video.currentTime;
      const res=fl.detectForVideo(video,performance.now());
      if(res.faceBlendshapes?.[0]){
        const emo=classify(res.faceBlendshapes[0].categories);
        const reacting=['happy_react','dislike_react','poop_run','poop_squat','sneeze','stunned'].includes(mode);
        if(emo!==currentEmotion&&!reacting){ 
          applyTheme(emo); 
          if(mode==='run')setGlow(true); 
          if(typeof gameStarted !== 'undefined' && gameStarted) {
            const dSvg = document.getElementById('dog-svg');
            if(dSvg) dSvg.innerHTML = getAvatarRects(emo);
          }
        }
      }
      if(handLandmarker){
        const hRes=handLandmarker.detectForVideo(video,performance.now());
        const raw=(hRes.landmarks??[]).map(lms=>({
          x:(1-lms[8].x)*innerWidth, y:lms[8].y*innerHeight
        })).sort((a,b)=>a.x-b.x); // leftmost = player1
        if(raw.length>=1){
          handDetected=true;
          mx=raw[0].x; my=raw[0].y;
          cursorDot.style.left=mx+'px'; cursorDot.style.top=my+'px';
          cursorDot.classList.add('hand-active');
        }else{
          handDetected=false;
          cursorDot.classList.remove('hand-active');
        }
        if(raw.length>=2){
          hand2Detected=true;
          hand2X=raw[1].x; hand2Y=raw[1].y;
          cursorDot2.style.left=hand2X+'px'; cursorDot2.style.top=hand2Y+'px';
          cursorDot2.classList.add('hand2-active');
        }else{
          hand2Detected=false;
          cursorDot2.classList.remove('hand2-active');
        }
      }
    }
    requestAnimationFrame(detect);
  }
  requestAnimationFrame(detect);
}
function classify(cats){
  const g=n=>cats.find(c=>c.categoryName===n)?.score??0;
  const happy    =(g('mouthSmileLeft')+g('mouthSmileRight'))*.50+(g('cheekSquintLeft')+g('cheekSquintRight'))*.25;
  const angry    =(g('browDownLeft')+g('browDownRight'))*.55+(g('mouthPressLeft')+g('mouthPressRight'))*.45;
  const disgusted=(g('noseSneerLeft')+g('noseSneerRight'))*.65+g('mouthShrugLower')*.35;
  const surprised= g('jawOpen')*.55+(g('eyeWideLeft')+g('eyeWideRight'))*.45;
  const sad      = g('browInnerUp')*.40+(g('mouthFrownLeft')+g('mouthFrownRight'))*.60;
  const scores={happy,angry,disgusted,surprised,sad};
  const [top,score]=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0];
  return score>0.30?top:'default';
}
initFace();

function getAvatarRects(emotion) {
  let style = 1;
  if(emotion === 'happy') style = 3;
  else if(emotion === 'angry') style = 2;
  else if(emotion === 'surprised') style = 4;
  else if(emotion === 'sad') style = 5;
  else if(emotion === 'disgusted') style = 6;

  function gridToRects(g, p) {
    let r='';
    for(let y=0;y<g.length;y++){
      for(let x=0;x<g[y].length;x++){
        if(g[y][x]!==' ' && p[g[y][x]]) r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${p[g[y][x]]}"/>`;
      }
    }
    return r;
  }

  if(style === 1) { // Default
    const grid = [
      "      HHHH      ",
      "     HHHHHH     ",
      "    FHWFFWHF    ",
      "    FFFFFFFF    ",
      "     FMMMMF     ",
      "      FFFF      ",
      "     TTTTTT     ",
      "    ATTTTTTA    ",
      "    A TTTT A    ",
      "    A TTTT A    ",
      "      JJJJ      ",
      "      JJJJ      ",
      "      J  J      ",
      "      J  J      ",
      "     DD  DD     "
    ];
    return gridToRects(grid, {'H':'#111','F':'#ffe2ad','W':'#fca311','M':'#1a0800','T':'#fff','A':'#ffe2ad','J':'#1d3557','D':'#222'});
  } else if (style === 2) { // Angry
    const grid = [
      "      HHHH      ",
      "   g HHHHHH g   ",
      "   gGHWWWWWHg   ",
      "   gGFFFFFFFF   ",
      "     FMMMMF     ",
      "      FFFF      ",
      "     RRRRRR     ",
      "    ARRWWRRA    ",
      "    A RRWR A    ",
      "    A RRRR A    ",
      "      BBBB      ",
      "      BBBB      ",
      "      B  B      ",
      "      B  B      ",
      "     Wb  bW     "
    ];
    return gridToRects(grid, {'H':'#111','F':'#ffe2ad','W':'#222','M':'#1a0800','R':'#cc1800','A':'#ffe2ad','B':'#111','g':'#7af04a','G':'#fff','b':'#1d3557'});
  } else if (style === 3) { // Happy
    const grid = [
      "      RRRR      ",
      "   w RRRRRR w   ",
      "   wWRFFFFRWw   ",
      "   wWFFFFFFWw   ",
      "     Fm  mF     ",
      "      FFFF      ",
      "     TTTTTT     ",
      "    ATTTTTTA    ",
      "    A TTTT A    ",
      "    A TTTT A    ",
      "      CCCC      ",
      "      CCCC      ",
      "      C  C      ",
      "      C  C      ",
      "     DD  DD     "
    ];
    return gridToRects(grid, {'R':'#cc1800','F':'#ffe2ad','T':'#fff','A':'#ffe2ad','C':'#4b5320','D':'#222','w':'#fff','W':'#888','m':'#cc1800'});
  } else if (style === 4) { // Surprised
    const grid = [
      "      UUUU      ",
      "     UUUUUU     ",
      "    FUWFFWUF    ",
      "    FWWFFWWF    ",
      "     F oo F     ",
      "      FFFF      ",
      "     UUUUUU     ",
      "    AUUUUUUA    ",
      "    A UUUU A    ",
      "    A UUUU A    ",
      "      BBBB      ",
      "      BBBB      ",
      "      B  B      ",
      "      B  B      ",
      "     DD  DD     "
    ];
    return gridToRects(grid, {'U':'#0077e6','F':'#ffe2ad','W':'#fff','A':'#ffe2ad','B':'#1d3557','D':'#eee','o':'#111'});
  } else if (style === 5) { // Sad
    const grid = [
      "      HHHH      ",
      "     HHHHHH     ",
      "    FHWFFWHF    ",
      "    FttFFttF    ",
      "     F -- F     ",
      "      FFFF      ",
      "     GGGGGG     ",
      "    AGGGGGGA    ",
      "    A GGGG A    ",
      "    A GGGG A    ",
      "      JJJJ      ",
      "      JJJJ      ",
      "      J  J      ",
      "      J  J      ",
      "     DD  DD     "
    ];
    return gridToRects(grid, {'H':'#111','F':'#ffe2ad','W':'#111','t':'#48c8ff','-':'#1a0800','G':'#888','A':'#ffe2ad','J':'#1d3557','D':'#222'});
  } else if (style === 6) { // Disgusted
    const grid = [
      "      HHHH      ",
      "     HHHHHH     ",
      "    FHWFFWHF    ",
      "    FFFFFFFF    ",
      "     F nn F     ",
      "      FFFF      ",
      "     KKKKKK     ",
      "    AKKKKKKA    ",
      "    A KKKK A    ",
      "    A KKKK A    ",
      "      BBBB      ",
      "      BBBB      ",
      "      B  B      ",
      "      B  B      ",
      "     DD  DD     "
    ];
    return gridToRects(grid, {'H':'#111','F':'#ffe2ad','W':'#111','n':'#3a7a10','K':'#7af04a','A':'#ffe2ad','B':'#111','D':'#222'});
  }
}

function getAvatarSVG(emotion) {
  return `<svg id="dog-svg" viewBox="0 0 16 18" width="130" height="146" shape-rendering="crispEdges">${getAvatarRects(emotion)}</svg>`;
}
